spring:
  application:
    name: bokt-next

  # Java 21 virtual threads — под нагрузку мгновенных кредитов дешёвая конкурентность
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${BOKT_DB_URL:jdbc:postgresql://localhost:5432/bokt}
    username: ${BOKT_DB_USER:bokt}
    password: ${BOKT_DB_PASSWORD:bokt}
    hikari:
      maximum-pool-size: ${BOKT_DB_POOL:20}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # схемой управляет Flyway, не Hibernate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Настройки безопасности приложения
bokt:
  jwt:
    issuer: bokt-next
    access-token-ttl: PT10M          # 10 минут
    refresh-token-ttl: P7D           # 7 дней
    # В проде задать ключи (иначе будет сгенерирована временная пара):
    private-key-pem: ${BOKT_JWT_PRIVATE_KEY:}
    public-key-pem: ${BOKT_JWT_PUBLIC_KEY:}
  otp:
    length: 6
    ttl-minutes: 5
  bootstrap:
    # пароль супер-админа при первом старте; если пусто — сгенерируется и попадёт в лог
    super-admin-password: ${BOKT_SUPERADMIN_PASSWORD:admin12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# correlationId выводится в каждой строке лога — сквозная трассировка запроса
logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"
  level:
    az.bokt: INFO
    org.hibernate.SQL: WARN
